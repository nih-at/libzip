name: CIFuzz
on: [pull_request]
permissions:
  contents: read
jobs:
  Fuzzing:
    runs-on: ubuntu-latest
    steps:
    - name: Build Fuzzers
      uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@0ddfba395c634ac915c7a1315e8c4d6f2bd03d8c # master
      with:
        oss-fuzz-project-name: 'libzip'
        dry-run: false
    - name: Run Fuzzers
      uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@0ddfba395c634ac915c7a1315e8c4d6f2bd03d8c # master
      with:
        oss-fuzz-project-name: 'libzip'
        fuzz-seconds: 600
        dry-run: false
    - name: Upload Crash
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: artifacts
        path: ./out/artifacts
